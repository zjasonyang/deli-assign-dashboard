<section id="login-screen" class="login" hidden aria-labelledby="login-title">
  <h1 id="login-title">派工日曆</h1>
  <form id="login-form">
    <label>帳號<input id="username" name="username" autocomplete="username" required></label>
    <label>密碼<input id="password" name="password" type="password" autocomplete="current-password" required></label>
    <p id="login-error" class="login-error" role="alert" hidden></p>
    <button id="login-submit" class="primary" type="submit">登入</button>
  </form>
  <details><summary>本機測試帳號</summary><p>admin / admin123!　可編輯全部欄位</p><p>user / user123!　可編輯備註</p></details>
</section>
<main class="app" id="dashboard" hidden>
  <div class="topbar"><h1>派工日曆</h1><div class="account"><details class="account-menu" id="account-menu"><summary id="account-role"></summary><nav class="account-popover" aria-label="帳號選單"><a id="calendar-link" href="/">派工日曆</a><a id="personnel-link" href="/admin/personnel" hidden>人員管理</a><button id="logout">登出</button></nav></details></div></div>
  <div id="global-error" class="global-error" role="alert" hidden><span id="global-error-text"></span><button id="retry">重試</button></div>
  <section id="personnel-page" class="personnel-page" hidden aria-labelledby="people-heading">
    <a id="back-calendar" href="/">返回派工日曆</a>
    <h2 id="people-heading">人員管理</h2>
    <div id="people-list"></div>
    <form id="new-person" class="new-person"><input id="new-person-name" aria-label="新人員姓名" placeholder="新人員姓名" maxlength="80" required><input id="new-person-short" aria-label="新人員縮寫" placeholder="縮寫（自動）" maxlength="8"><button class="primary" type="submit">新增人員</button></form>
    <p id="people-feedback" role="status"></p>
  </section>
  <p id="access-denied" class="global-error" hidden>此頁僅限 admin 使用。<a id="denied-back" href="/">返回派工日曆</a></p>
  <div id="calendar-page">
  <header class="bar">
    <h2 id="range" aria-live="polite"></h2>
    <div class="nav">
      <button class="icon" id="prev" aria-label="上一週"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
      <button class="icon" id="next" aria-label="下一週"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
      <button id="today">今天</button>
    </div>
    <div class="tools">
      <button class="primary" id="new-order" hidden>建立新工單</button>
      <select id="team" aria-label="篩選團隊"><option value="all">全部團隊</option><option value="north-a">北部 A</option><option value="south-a">南部 A</option><option value="south-b">南部 B</option></select>
      <select id="status" aria-label="篩選工單狀態"><option value="all">全部狀態</option><option>待出勤</option><option>進行中</option><option>已完成</option></select>
      <div class="tabs" role="group" aria-label="日曆顯示方式"><button id="week" aria-pressed="true">週曆</button><button id="month" aria-pressed="false">月曆</button></div>
    </div>
  </header>
  <div class="layout">
    <aside class="rail" aria-label="工單與派工編輯">
      <section id="editor" class="editor" hidden aria-labelledby="editor-title">
        <div class="editor-header"><h2 id="editor-title"></h2><p id="editor-meta" class="editor-meta"></p><p id="editor-details" class="editor-details"></p><button class="icon" id="close" aria-label="關閉工單詳情"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
        <form id="order-form">
          <dl class="work-details" id="readonly-fields">
            <div><dt>項目名稱</dt><dd id="detail-title"></dd></div>
            <div><dt>人員(主)</dt><dd id="detail-person1"></dd></div><div><dt>人員(從)</dt><dd id="detail-person2"></dd></div>
            <div><dt>地址</dt><dd id="detail-address"></dd></div>
            <div><dt>聯絡電話</dt><dd><a id="detail-phone"></a></dd></div>
            <div><dt>內容</dt><dd id="detail-content"></dd></div>
          </dl>
          <div class="admin-fields" id="admin-fields" hidden>
            <div class="basic-fields">
              <label>項目名稱<input id="edit-title" maxlength="200" required></label>
              <label>客戶／門市<input id="edit-customer" maxlength="200" required></label>
              <label>人員(主)<select id="edit-person1" aria-label="人員(主)"></select></label>
              <label>人員(從)<select id="edit-person2" aria-label="人員(從)"></select></label>
              <label class="span-two">地區<select id="edit-region"><option>北部</option><option>南部</option></select></label>
              <label class="span-two">狀態<select id="edit-status"><option>待出勤</option><option>進行中</option><option>已完成</option></select></label>
              <label class="span-two">優先順序<select id="edit-priority"><option value="normal">一般</option><option value="urgent">急件</option></select></label>
              <label>地址<input id="edit-address" maxlength="500"></label>
              <label>聯絡電話<input id="edit-phone" type="tel" maxlength="100"></label>
            </div>
            <label class="content-field">內容<textarea id="edit-content" maxlength="5000" rows="3"></textarea></label>
            <div class="schedule-block">
              <label class="schedule-toggle"><input type="checkbox" id="edit-scheduled">安排出勤</label>
              <div class="schedule-fields" id="schedule-fields">
                <fieldset class="team-field"><legend>派工團隊</legend><div class="team-options" id="edit-team"></div></fieldset>
                <label class="date-field">出勤日期<input type="date" id="edit-date"></label>
                <label>開始時間<input type="time" id="edit-start"></label>
                <label>結束時間<input type="time" id="edit-end"></label>
              </div>
            </div>
          </div>
          <label class="notes-field">備註<textarea id="edit-notes" maxlength="5000" rows="3"></textarea></label>
          <div class="actions"><button class="primary" type="submit" id="save-order">儲存工單</button><span id="feedback" role="status"></span></div>
        </form>
      </section>
      <details id="queue-panel" class="queue-panel" open><summary id="queue-title">待排工單<span class="count" id="queue-count"></span></summary><div id="queue" class="queue"></div></details>
    </aside>
    <section class="board" aria-label="派工日曆">
      <div class="calendar-bar"><div class="calendar-key" aria-label="縮寫說明"><span><b>北A</b> 北部 A 組</span><span><b>南A</b> 南部 A 組</span><span><b>南B</b> 南部 B 組</span><span><i class="urgent">急</i> 急件</span><span><b>WO</b> 工單編號</span></div><div class="calendar-actions"><div id="personnel-highlights" class="personnel-highlights" role="group" aria-label="人員工單高亮"></div><div class="week-controls" id="week-controls"><button id="expand-all">全部展開</button><button id="collapse-all">全部收合</button></div></div></div>
      <div id="calendar"></div>
    </section>
  </div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDate = s => new Date(s+'T12:00:00');
const addDays = (d,n) => { const next = new Date(d); next.setDate(next.getDate()+n); return next; };
const weekStart = d => addDays(d,-((d.getDay()+6)%7));
const today = parseDate(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()));
let teams = [], orders = [], assignments = [], personnel = [], user = null;
const NEW_ORDER = '__new__';
let activePersonId = null;
let cursor = new Date(today), view = 'week', selectedId = null, selectedDate = null, lastOrderId = null;
const canEdit = () => user?.role === 'admin';
const orderFor = a => orders.find(o => o.id === a.workOrderId);
const teamFor = a => teams.find(t => t.id === a.teamId);
const statusMatches = o => $('status').value === 'all' || o.status === $('status').value;
const filtered = () => assignments.filter(a => ($('team').value === 'all' || a.teamId === $('team').value) && statusMatches(orderFor(a)));
const selectedTeam = () => document.querySelector('input[name="edit-team"]:checked')?.value;
const sorted = list => list.slice().sort((a,b) => a.start.localeCompare(b.start));
function readExpandedTeams() {
  try {
    const ids = JSON.parse(localStorage.getItem('deli.expandedTeams'));
    if (Array.isArray(ids) && ids.every(id => typeof id === 'string')) return new Set(ids);
  } catch {}
  return new Set(['north-a']);
}
let expandedTeams = readExpandedTeams();
function rememberTeams() {
  try { localStorage.setItem('deli.expandedTeams',JSON.stringify([...expandedTeams])); } catch {}
}
function expandTeam(teamId) {
  expandedTeams.add(teamId); rememberTeams();
}


async function api(path, options = {}) {
  let response;
  try {
    response = await fetch(path,{credentials:'same-origin',...options,
      headers:{...(options.body ? {'Content-Type':'application/json'} : {}),...options.headers}});
  } catch { throw new Error('無法連線到服務，請確認本機服務已啟動。'); }
  const data = await response.json();
  if (!response.ok) { const error = new Error(data.error || '服務暫時無法使用。'); error.status = response.status; throw error; }
  return data;
}

function showLogin(message = '') {
  user = null; teams = []; orders = []; assignments = []; personnel = []; selectedId = null;
  activePersonId = null;
  $('account-menu').open = false;
  $('queue-panel').open = true;
  $('dashboard').hidden = true;
  $('editor').hidden = true;
  $('calendar').innerHTML = ''; $('queue').innerHTML = '';
  $('login-screen').hidden = false;
  $('password').value = '';
  $('login-error').textContent = message;
  $('login-error').hidden = !message;
}

function showError(error) {
  if (error.status === 401) { showLogin('登入已過期，請重新登入。'); return; }
  $('global-error-text').textContent = error.message || '無法連線到服務，請確認服務已啟動。';
  $('global-error').hidden = false;
}

async function loadData() {
  const data = await api('/api/dashboard');
  ({teams,orders,assignments,personnel,user} = data);
  $('account-role').textContent = user.role;
  $('order-form').dataset.role = user.role;
  $('admin-fields').hidden = !canEdit();
  $('readonly-fields').hidden = canEdit();
  $('global-error').hidden = true;
  $('login-screen').hidden = true;
  $('dashboard').hidden = false;
  $('personnel-link').hidden = !canEdit();
  $('new-order').hidden = !canEdit();
  const query = document.documentElement.dataset.theme === 'light' ? '?theme=light' : '';
  for (const id of ['calendar-link','back-calendar','denied-back']) $(id).href = '/' + query;
  $('personnel-link').href = '/admin/personnel' + query;
  const management = location.pathname === '/admin/personnel';
  $('calendar-page').hidden = management;
  $('personnel-page').hidden = !management || !canEdit();
  $('access-denied').hidden = !management || canEdit();
  if (management && canEdit()) renderPersonnel();
  render();
}

function matchesPerson(order) {
  return !activePersonId || order.person1Id===activePersonId || order.person2Id===activePersonId;
}
function personFocusClass(order) {
  return activePersonId ? matchesPerson(order) ? 'is-person-match' : 'is-person-dim' : '';
}
function crewMarkup(order) {
  return '<span class="crew">'+[['person1Id','人員(主)'],['person2Id','人員(從)']].map(([key,label])=>{
    const person=personnel.find(p=>p.id===order[key]);
    return person ? `<i class="person-code" title="${esc(label+'：'+person.name)}" aria-label="${esc(label+'：'+person.name)}">${esc(person.short || person.name)}</i>` : '';
  }).join('')+'</span>';
}
function renderPersonFilters() {
  $('personnel-highlights').innerHTML=`<button class="person-filter" data-focus-person="" aria-pressed="${!activePersonId}">全部人員</button>`+personnel.map(p=>`<button class="person-filter" data-focus-person="${esc(p.id)}" aria-pressed="${activePersonId===p.id}" title="${esc(p.name)}"><b>${esc(p.short || p.name)}</b>${esc(p.name)}</button>`).join('');
}
function jobButton(a) {
  const o = orderFor(a);
  const label = `${teamFor(a).name}，${a.start} 至 ${a.end}，${o.title}，${o.customer}，${o.status}，人員(主)：${o.person1||'未指派'}，人員(從)：${o.person2||'未指派'}${o.priority === 'urgent' ? '，急件' : ''}`;
  return `<button class="job order-card ${personFocusClass(o)}" data-order="${esc(o.id)}" data-status="${esc(o.status)}" aria-label="${esc(label)}" title="${esc(label)}" aria-pressed="${selectedId === o.id}">
    <time>${esc(a.start)}–${esc(a.end)}</time><span class="job-status">${esc(o.status)}</span>
    <span class="job-title">${o.priority === 'urgent' ? '<i class="urgent">急</i>' : ''}<b>${esc(o.title)}</b></span>
    <span class="customer"><span class="customer-name">${esc(o.customer)}</span>${crewMarkup(o)}</span>
  </button>`;
}

function renderWeek(list) {
  const start = weekStart(cursor), end = addDays(start,6);
  const endMonth = end.getMonth() !== start.getMonth() ? `${end.getMonth()+1}月` : '';
  const year = start.getFullYear() !== today.getFullYear() ? `${start.getFullYear()}年` : '';
  $('range').textContent = `${year}${start.getMonth()+1}月${start.getDate()}日–${endMonth}${end.getDate()}日`;
  const visible = list.filter(a => a.date >= dateKey(start) && a.date <= dateKey(end));
  const shownTeams = teams.filter(t => $('team').value === 'all' || t.id === $('team').value);
  const weekdays = ['一','二','三','四','五','六','日'];
  return `<div class="week-scroll" role="region" tabindex="0" aria-label="每週團隊派工，週一到週日橫排，可左右捲動"><div class="week-board">
    <div class="week-head"><div class="corner">團隊</div>${weekdays.map((w,i) => {
      const d = addDays(start,i), key = dateKey(d);
      return `<div class="${key === dateKey(today) ? 'is-today' : ''}">週${w}<br><b>${d.getDate()}</b></div>`;
    }).join('')}</div>
    ${shownTeams.map(t => {
      const expanded = expandedTeams.has(t.id);
      return `<div class="team-row ${expanded ? '' : 'is-collapsed'}" data-team-row="${esc(t.id)}"><button type="button" class="team-name" data-toggle-team="${esc(t.id)}" aria-expanded="${expanded}" aria-label="${expanded ? '收合' : '展開'}${esc(t.name)}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg><span><strong>${esc(t.name)}</strong><small>${visible.filter(a => a.teamId === t.id).length} 筆派工</small></span></button>
      ${weekdays.map((_,i) => {
        const key = dateKey(addDays(start,i)), cell = sorted(visible.filter(a => a.date === key && a.teamId === t.id));
        const editable = expanded && selectedId && canEdit() && cell.length === 0;
        const contents = expanded ? cell.map(jobButton).join('') : cell.length ? `<button type="button" class="lane-summary" data-expand-team="${esc(t.id)}" data-date="${key}" aria-label="展開${esc(t.name)} ${key} 的 ${cell.length} 件派工">${cell.length} 件${cell.some(a => orderFor(a).priority==='urgent') ? '<small>含急件</small>' : ''}</button>` : '<span class="lane-zero">0 件</span>';
        return `<div class="lane ${i>4 ? 'is-weekend' : ''} ${selectedDate === key ? 'is-selected' : ''} ${editable ? 'is-editable' : ''}" data-team="${esc(t.id)}" data-date="${key}" ${editable ? `tabindex="0" role="button" aria-label="將工單安排至 ${key} ${esc(t.name)}"` : `role="group" aria-label="${key} ${esc(t.name)}，${cell.length} 筆派工"`}>${contents}</div>`;
      }).join('')}</div>`;
    }).join('')}
  </div></div>`;
}

function renderMonth(list) {
  const first = new Date(cursor.getFullYear(),cursor.getMonth(),1,12);
  const gridStart = weekStart(first), last = new Date(cursor.getFullYear(),cursor.getMonth()+1,0,12);
  const days = Math.ceil((((first.getDay()+6)%7)+last.getDate())/7)*7;
  $('range').textContent = `${cursor.getFullYear()}年${cursor.getMonth()+1}月`;
  return `<div class="month-grid">${['一','二','三','四','五','六','日'].map(w => `<div class="month-head"><span class="prefix">週</span>${w}</div>`).join('')}
    ${Array.from({length:days},(_,i) => {
      const d = addDays(gridStart,i), key = dateKey(d), daily = sorted(list.filter(a => a.date === key));
      const urgent = daily.some(a => orderFor(a).priority === 'urgent');
      return `<div class="month-cell ${d.getMonth() !== cursor.getMonth() ? 'other' : ''}">
        <button class="day-button ${key === dateKey(today) ? 'is-today' : ''}" data-day="${key}" aria-label="查看 ${key} 所在週">${d.getDate()}</button>
        ${daily.slice(0,3).map(a => { const o = orderFor(a); return `<button class="mjob order-card ${personFocusClass(o)}" data-order="${esc(o.id)}" data-status="${esc(o.status)}" aria-label="${esc(teamFor(a).name+' '+o.title+' '+o.customer)}" title="${esc(teamFor(a).name+' '+o.title+' '+o.customer)}"><b>${esc(teamFor(a).short)}</b><span class="month-title">${esc(o.title)}</span>${crewMarkup(o)}</button>`; }).join('')}
        ${daily.length > 3 ? `<button class="month-more" data-day="${key}" aria-label="查看 ${key} 全部 ${daily.length} 筆派工">+${daily.length-3}</button>` : ''}
        ${daily.length ? `<button class="mcount order-card ${activePersonId ? daily.some(a=>matchesPerson(orderFor(a))) ? 'is-person-match' : 'is-person-dim' : ''} ${urgent ? 'urgent-count' : ''}" data-day="${key}" aria-label="查看 ${key} 的 ${daily.length} 筆派工${urgent ? '，含急件' : ''}">${daily.length}筆</button>` : ''}
      </div>`;
    }).join('')}
  </div>`;
}

function renderQueue() {
  const region = teams.find(t => t.id === $('team').value)?.region;
  const queue = orders.filter(o => !assignments.some(a => a.workOrderId === o.id) && statusMatches(o) && (!region || o.region === region));
  $('queue-count').textContent = queue.length;
  $('queue').innerHTML = queue.length ? queue.map(o => `<button class="queue-item order-card ${personFocusClass(o)}" data-order="${esc(o.id)}" aria-pressed="${selectedId === o.id}">
    <span class="queue-top">${o.priority === 'urgent' ? '<i class="urgent">急</i>' : ''}<strong>${esc(o.title)}</strong><span class="region">${esc(o.region)}</span></span>
    <span class="queue-footer"><span class="queue-meta">${esc(o.id)} · ${esc(o.customer)} · ${esc(o.address)}</span>${crewMarkup(o)}</span>
  </button>`).join('') : '<p class="empty">沒有符合條件的待排工單。</p>';
}

function highlightTarget() {
  const teamId = selectedTeam(), date = $('edit-date').value;
  document.querySelectorAll('.lane').forEach(lane => lane.classList.toggle('is-target', !!selectedId && canEdit() && $('edit-scheduled').checked && lane.dataset.team === teamId && lane.dataset.date === date));
}

function render() {
  $('week-controls').hidden = view !== 'week';
  $('week').setAttribute('aria-pressed', view === 'week');
  $('month').setAttribute('aria-pressed', view === 'month');
  $('prev').setAttribute('aria-label', view === 'week' ? '上一週' : '上一月');
  $('next').setAttribute('aria-label', view === 'week' ? '下一週' : '下一月');
  const left = document.querySelector('.week-scroll')?.scrollLeft || 0;
  $('calendar').innerHTML = view === 'week' ? renderWeek(filtered()) : renderMonth(filtered());
  const scroll = document.querySelector('.week-scroll');
  if (scroll) scroll.scrollLeft = left;
  renderQueue();
  renderPersonFilters();
  highlightTarget();
}

function openOrder(id = null) {
  const creating = id === null;
  if (creating && !canEdit()) return;
  selectedId = creating ? NEW_ORDER : id; lastOrderId = id;
  const defaultRegion = teams.find(t=>t.id===$('team').value)?.region || '北部';
  const o = creating ? {title:'',customer:'',region:defaultRegion,address:'',phone:'',status:'待出勤',priority:'normal',content:'',notes:'',person1Id:null,person2Id:null,person1:'',person2:''} : orders.find(o => o.id === id);
  const a = creating ? null : assignments.find(a => a.workOrderId === id);
  const filteredTeam = teams.find(t => t.id === $('team').value && t.region === o.region);
  const defaultTeam = a?.teamId || filteredTeam?.id || teams.find(t => t.region === o.region).id;
  $('editor').hidden = false;
  $('queue-panel').open = false;
  if (a) expandTeam(a.teamId);
  $('editor-title').textContent = creating ? '建立新工單' : '工單詳情';
  $('editor-meta').textContent = creating ? '' : `${o.id} · ${o.customer}`;
  $('detail-title').textContent = o.title;
  $('detail-person1').textContent = o.person1 || '未指派';
  $('detail-person2').textContent = o.person2 || '未指派';
  $('detail-address').textContent = o.address || '未提供';
  $('detail-content').textContent = o.content || '未提供';
  const phone = $('detail-phone');
  phone.textContent = o.phone || '未提供';
  phone.removeAttribute('href');
  if (/^[+()0-9\s-]{5,30}$/.test(o.phone) && /[0-9]/.test(o.phone)) phone.href = 'tel:' + o.phone.replace(/[^+0-9]/g,'');
  $('editor-details').textContent = `${o.status}${a ? ` · ${teamFor(a).name} · ${a.date} ${a.start}–${a.end}` : ' · 未排程'}`;
  $('admin-fields').hidden = !canEdit();
  $('readonly-fields').hidden = canEdit();
  for (const field of ['title','customer','region','address','phone','status','priority','content']) {
    $('edit-'+field).value = o[field];
    $('edit-'+field).disabled = !canEdit();
  }
  const choices = '<option value="">未指派</option>' + personnel.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
  for (const n of [1,2]) { $('edit-person'+n).innerHTML = choices; $('edit-person'+n).value = o['person'+n+'Id'] || ''; $('edit-person'+n).disabled = !canEdit(); }
  $('edit-notes').value = o.notes;
  $('edit-scheduled').checked = !!a;
  $('save-order').textContent = creating ? '建立工單' : canEdit() ? '儲存工單' : '儲存備註';
  $('edit-team').innerHTML = canEdit() ? teams.map(t => `<label><input type="radio" name="edit-team" value="${esc(t.id)}" ${t.id === defaultTeam ? 'checked' : ''} required><span>${esc(t.name)}</span></label>`).join('') : '';
  $('edit-date').value = a?.date || dateKey(cursor);
  $('edit-start').value = a?.start || '09:00';
  $('edit-end').value = a?.end || '11:00';
  syncScheduleFields();
  $('feedback').textContent = '';
  if (a) cursor = parseDate(a.date);
  render();
  $('editor').scrollIntoView({block:'start'});
  const focus = canEdit() ? $('edit-title') : $('edit-notes');
  focus.focus({preventScroll:true});
}

function closeEditor() {
  $('editor').hidden = true; $('queue-panel').open = true; selectedId = null; render();
  const target = [...document.querySelectorAll('[data-order]')].find(e => e.dataset.order === lastOrderId);
  (target || $('today')).focus({preventScroll:true});
}

function setTarget(lane) {
  if (!canEdit() || !selectedId) return;
  $('edit-scheduled').checked = true; syncScheduleFields();
  document.querySelector(`input[name="edit-team"][value="${lane.dataset.team}"]`).checked = true;
  $('edit-date').value = lane.dataset.date;
  highlightTarget();
}

document.addEventListener('click', e => {
  const personButton = e.target.closest('[data-focus-person]');
  if (personButton) {
    const id = personButton.dataset.focusPerson;
    activePersonId = id && activePersonId!==id ? id : null;
    if (activePersonId) {
      const start=dateKey(weekStart(cursor)),end=dateKey(addDays(weekStart(cursor),6)),month=dateKey(cursor).slice(0,7);
      filtered().filter(a=>matchesPerson(orderFor(a)) && (view==='week' ? a.date>=start && a.date<=end : a.date.slice(0,7)===month)).forEach(a=>expandTeam(a.teamId));
    }
    render();
    document.querySelector(`[data-focus-person="${activePersonId || ''}"]`).focus({preventScroll:true});
    return;
  }
  const toggle = e.target.closest('[data-toggle-team]');
  if (toggle) {
    const id = toggle.dataset.toggleTeam;
    if (expandedTeams.has(id)) expandedTeams.delete(id); else expandedTeams.add(id);
    rememberTeams(); render();
    document.querySelector(`[data-toggle-team="${id}"]`).focus({preventScroll:true});
    return;
  }
  const expand = e.target.closest('[data-expand-team]');
  if (expand) {
    expandTeam(expand.dataset.expandTeam); selectedDate = expand.dataset.date; render();
    document.querySelector(`[data-team="${expand.dataset.expandTeam}"][data-date="${expand.dataset.date}"] .job`)?.focus({preventScroll:true});
    return;
  }
  const order = e.target.closest('[data-order]');
  if (order) { openOrder(order.dataset.order); return; }
  const day = e.target.closest('[data-day]');
  if (day) {
    cursor = parseDate(day.dataset.day); selectedDate = day.dataset.day; view = 'week'; render();
    const lane = document.querySelector(`.lane[data-date="${day.dataset.day}"]`);
    const scroll = document.querySelector('.week-scroll');
    if (lane && scroll) scroll.scrollLeft = lane.offsetLeft - scroll.offsetLeft - 96;
    return;
  }
  const lane = e.target.closest('.lane.is-editable');
  if (lane) setTarget(lane);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && selectedId) closeEditor();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.lane.is-editable')) { e.preventDefault(); setTarget(e.target); }
});
$('order-form').addEventListener('input', e => {
  if (e.target.matches('input[name="edit-team"],#edit-date') && $('edit-scheduled').checked && !expandedTeams.has(selectedTeam())) {
    expandTeam(selectedTeam()); render();
  }
  highlightTarget();
});
$('edit-scheduled').onchange = syncScheduleFields;
for (const mode of ['week','month']) $(mode).onclick = () => { view = mode; render(); };
for (const [id,direction] of [['prev',-1],['next',1]]) $(id).onclick = () => {
  cursor = view === 'week' ? addDays(cursor,direction*7) : new Date(cursor.getFullYear(),cursor.getMonth()+direction,1,12);
  selectedDate = null; render();
};
$('team').onchange = () => { if ($('team').value !== 'all') expandTeam($('team').value); render(); };
$('status').onchange = render;
$('expand-all').onclick = () => { teams.forEach(t => expandedTeams.add(t.id)); rememberTeams(); render(); };
$('collapse-all').onclick = () => { expandedTeams.clear(); rememberTeams(); render(); };
$('today').onclick = () => { cursor = new Date(today); selectedDate = dateKey(today); render(); };
$('close').onclick = closeEditor;
$('new-order').onclick = () => openOrder();

function syncScheduleFields() {
  const enabled = canEdit() && $('edit-scheduled').checked;
  $('schedule-fields').hidden = !enabled;
  if (enabled && !expandedTeams.has(selectedTeam())) { expandTeam(selectedTeam()); render(); }
  $('schedule-fields').querySelectorAll('input').forEach(input => { input.disabled = !enabled; input.required = enabled; });
  highlightTarget();
}

$('order-form').onsubmit = async e => {
  e.preventDefault();
  const orderId = selectedId, values = {notes:$('edit-notes').value};
  if (canEdit()) {
    for (const field of ['title','customer','region','address','phone','status','priority','content']) values[field] = $('edit-'+field).value;
    values.person1Id = $('edit-person1').value || null;
    values.person2Id = $('edit-person2').value || null;
    values.assignment = $('edit-scheduled').checked ? {teamId:selectedTeam(),date:$('edit-date').value,start:$('edit-start').value,end:$('edit-end').value} : null;
  }
  const submit = $('save-order');
  submit.disabled = true; submit.textContent = '儲存中…';
  try {
    const creating = orderId===NEW_ORDER;
    const result = await api(creating ? '/api/orders' : '/api/orders/'+encodeURIComponent(orderId),{method:creating ? 'POST' : 'PUT',body:JSON.stringify(values)});
    if (values.assignment) { cursor = parseDate(values.assignment.date); selectedDate = values.assignment.date; }
    await loadData();
    if (selectedId === orderId) { openOrder(result.order.id); $('feedback').className = 'saved'; $('feedback').textContent = creating ? '已建立工單。' : '已儲存。'; }
  } catch (error) {
    if (error.status === 401) showError(error);
    else if (selectedId === orderId) { $('feedback').className = 'error'; $('feedback').textContent = error.message; }
  } finally { submit.disabled = false; submit.textContent = selectedId===NEW_ORDER ? '建立工單' : canEdit() ? '儲存工單' : '儲存備註'; }
};

function renderPersonnel() {
  $('people-list').innerHTML = personnel.map(p => `<form class="person-row" data-person="${esc(p.id)}"><label><input aria-label="${esc(p.name)} 的姓名" name="name" value="${esc(p.name)}" maxlength="80" required></label><label class="person-short"><input aria-label="${esc(p.name)} 的縮寫" name="short" value="${esc(p.short || '')}" maxlength="8" required></label><button type="submit">儲存</button></form>`).join('');
}

async function savePerson(form, personId) {
  const input = form.querySelector('input'), button = form.querySelector('button');
  button.disabled = true; $('people-feedback').textContent = '';
  try {
    await api('/api/personnel'+(personId ? '/'+encodeURIComponent(personId) : ''),{method:personId ? 'PUT' : 'POST',body:JSON.stringify({name:input.value,...(personId || $('new-person-short').value.trim() ? {short:personId ? form.querySelector('[name=short]').value : $('new-person-short').value} : {})})});
    await loadData();
    if (!personId) { input.value = ''; $('new-person-short').value = ''; }
    $('people-feedback').className = 'saved'; $('people-feedback').textContent = '人員資料已儲存。';
  } catch (error) {
    if (error.status === 401) showError(error);
    else { $('people-feedback').className = 'error'; $('people-feedback').textContent = error.message; }
  } finally { button.disabled = false; }
}
$('people-list').addEventListener('submit',e => { e.preventDefault(); savePerson(e.target,e.target.dataset.person); });
$('new-person').onsubmit = e => { e.preventDefault(); savePerson(e.target,null); };

$('login-form').onsubmit = async e => {
  e.preventDefault(); $('login-submit').disabled = true; $('login-submit').textContent = '登入中…'; $('login-error').hidden = true;
  try {
    await api('/api/login',{method:'POST',body:JSON.stringify({username:$('username').value.trim(),password:$('password').value})});
    selectedId = null; $('editor').hidden = true;
    await loadData(); $('password').value = '';
  } catch (error) { showLogin(error.message); }
  finally { $('login-submit').disabled = false; $('login-submit').textContent = '登入'; }
};
$('logout').onclick = async () => {
  $('logout').disabled = true;
  try {
    await api('/api/logout',{method:'POST',body:'{}'});
    cursor = new Date(today); view = 'week'; selectedDate = null;
    $('team').value = 'all'; $('status').value = 'all'; showLogin(); $('username').focus();
  } catch (error) { showError(error); }
  finally { $('logout').disabled = false; }
};
$('retry').onclick = async () => { try { await loadData(); } catch (error) { showError(error); } };
loadData().catch(error => showLogin(error.status === 401 ? '' : '無法連線到服務，請確認本機服務已啟動，再重新整理。'));
</script>
</body>
</html>
